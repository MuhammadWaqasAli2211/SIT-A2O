<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Pre-rendered rather than one large source: a browser asked to make a
         16px icon out of a 500px logo downscales it in a single step and the
         ribbon turns to mush. Each size here was resampled and sharpened for
         the size it is served at. The .ico carries 16-256 for the browsers
         and OS surfaces that still ask for one. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/mark3d-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/mark3d-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/mark3d-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/mark3d-192.png" />
    <!-- The one place that still wants the white tile: an installed app icon
         has to fill its own rounded tile rather than float on whatever the
         launcher's wallpaper happens to be. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Bootcamp Flows</title>
    <meta
      name="description"
      content="Free, industry-aligned IT education. Bootcamp Flows has empowered over 250,000 students across Pakistan in web development, data science, mobile, cloud, and design. Applications open now."
    />
    <meta name="theme-color" content="#1800AD" />

    <!-- Three families, three jobs:

         IBM Plex Sans Condensed  — the interface face, everything English.
                                    Condensed earns real width back in the
                                    admin tables, which are the densest thing
                                    in the product.
         Jim Nightshade           — a display accent, dashboard only. It is a
                                    script face: used for a greeting line and
                                    nothing functional, never for data,
                                    numbers, labels or controls.
         Noto Nastaliq Urdu       — the onboarding forms, which reproduce
                                    Saylani's paper forms bilingually. No
                                    other screen needs Urdu-script coverage. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Jim+Nightshade&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bootcamp Flows — Free IT Bootcamps" />
    <meta
      property="og:description"
      content="Build a career in tech. Pay nothing for it. Free, industry-aligned IT bootcamps across Pakistan."
    />
    <meta property="og:site_name" content="Bootcamp Flows" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bootcamp Flows — Free IT Bootcamps" />
    <meta
      name="twitter:description"
      content="Build a career in tech. Pay nothing for it. Applications open now."
    />

    <!-- Applies the saved theme before first paint so a dark-mode user never
         sees a white flash while React boots. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('sit.theme')
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
