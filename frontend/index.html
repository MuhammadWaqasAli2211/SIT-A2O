<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Bootcamp Flows — Free IT Bootcamps in Pakistan</title>
    <meta
      name="description"
      content="Free, industry-aligned IT education. Bootcamp Flows has empowered over 250,000 students across Pakistan in web development, data science, mobile, cloud, and design. Applications open now."
    />
    <meta name="theme-color" content="#0f7a45" />

    <!-- Noto Nastaliq Urdu: needed for the onboarding forms, which reproduce
         Saylani's paper forms bilingually. No other font on this site needs
         Urdu-script coverage. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bootcamp Flows — Free IT Bootcamps" />
    <meta
      property="og:description"
      content="Build a career in tech. Pay nothing for it. Free, industry-aligned IT bootcamps across Pakistan."
    />
    <meta property="og:site_name" content="Bootcamp Flows" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bootcamp Flows — Free IT Bootcamps" />
    <meta
      name="twitter:description"
      content="Build a career in tech. Pay nothing for it. Applications open now."
    />

    <!-- Applies the saved theme before first paint so a dark-mode user never
         sees a white flash while React boots. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('sit.theme')
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
